[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-tongue"
version = "0.2.0"
description = "Output-only cross-model behavioral translation, drift measurement, and falsifiable prediction."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "RJ Marler", email = "rjmarler8@gmail.com"},
]
dependencies = [
  "numpy>=1.24",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.6"]
experiment = ["httpx[socks]>=0.28", "openai>=1.68"]

[project.scripts]
vector-tongue = "vector_tongue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["prototype_v1"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
